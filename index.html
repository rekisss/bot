<title>機械手臂指令小抄</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"><style id="page-css">

:root{
  --bg:#edf1ef; --surface:#fafcfb; --ink:#17201c; --muted:#56645d; --line:#d2dbd6;
  --accent:#0d6b6e; --accent-ink:#ffffff; --accent-soft:#d6eae9;
  --code-bg:#18211e; --code-fg:#dfeae4; --code-dim:#8a9b93;
  --term:#2b3933; --term-ink:#e9f1ec; --ps:#dbe5fb; --ps-ink:#22449c;
  --exp:#f6e6c9; --exp-ink:#784805; --file:#e7defa; --file-ink:#523596; --none:#e1e7e4; --none-ink:#46534d;
  --warn:#b2451a; --warn-soft:#fbe4d8; --bar-bg:#17201c; --bar-fg:#edf1ef;
  --display:"LXGW WenKai TC","Noto Serif TC","PingFang TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18201d; --ink:#e2eae5; --muted:#99a8a1; --line:#2b3632;
  --accent:#5ec3c1; --accent-ink:#06201f; --accent-soft:#1c3533;
  --code-bg:#0a0f0d; --code-fg:#dfeae4; --code-dim:#71837b;
  --term:#d6e2db; --term-ink:#15201b; --ps:#1f2c4d; --ps-ink:#abc3ff;
  --exp:#3a2c12; --exp-ink:#f2c77b; --file:#2c2346; --file-ink:#cdb9ff; --none:#25302c; --none-ink:#a9b6b0;
  --warn:#ff9c72; --warn-soft:#3a2017; --bar-bg:#e2eae5; --bar-fg:#101614; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201d; --ink:#e2eae5; --muted:#99a8a1; --line:#2b3632;
  --accent:#5ec3c1; --accent-ink:#06201f; --accent-soft:#1c3533;
  --code-bg:#0a0f0d; --code-fg:#dfeae4; --code-dim:#71837b;
  --term:#d6e2db; --term-ink:#15201b; --ps:#1f2c4d; --ps-ink:#abc3ff;

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:32px 140px;display:flex;flex-direction:column;gap:40px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;color:var(--muted);font-family:var(--mono)}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,2.9rem);line-height:1.15;text-wrap:balance}
.lede{margin:0;max-width:62ch;color:var(--muted)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 260px;min-width:0;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
#q:disabled{opacity:.5}
.btn{padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;cursor:pointer}
.btn.on{background:var(--accent);color:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend span.item{display:inline-flex;gap:6px;align-items:center}

.toc{display:flex;flex-direction:column;gap:10px}
.toc-group{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.toc-label{flex:none;width:5.5em;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.toc-links{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 280px;min-width:0}
.toc a{padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
.toc a:hover{border-color:var(--accent);color:var(--accent)}

.sec{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1.25;text-wrap:balance}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.intro{margin:0;color:var(--muted);max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px;align-items:start}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-top{display:flex;align-items:flex-start;gap:10px}
.card-top h3{margin:0;flex:1;min-width:0;font-size:1.05rem;line-height:1.4;font-weight:700}
.step{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.where{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px;white-space:nowrap;letter-spacing:.02em}
.w-term{background:var(--term);color:var(--term-ink)}
.w-ps{background:var(--ps);color:var(--ps-ink)}
.w-exp{background:var(--exp);color:var(--exp-ink)}
.w-file{background:var(--file);color:var(--file-ink)}
.w-none{background:var(--none);color:var(--none-ink)}
.desc{margin:0;white-space:pre-line}
.block{display:flex;flex-direction:column;gap:4px;min-width:0}
.block-label{font-size:12px;color:var(--muted);font-family:var(--mono)}
.code-wrap{position:relative;min-width:0}
pre{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:12px 74px 12px 14px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.65;white-space:pre}
.copy{position:absolute;top:7px;right:7px;padding:3px 10px;border-radius:5px;border:1px solid var(--code-dim);background:transparent;color:var(--code-fg);font-size:12px;cursor:pointer}
.copy:hover{border-color:var(--code-fg)}
.copy.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{margin:0;font-size:13.5px;color:var(--muted);white-space:pre-line}
.note b{color:var(--warn);margin-right:6px;font-weight:700}
.empty{color:var(--muted)}
.foot{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 編輯模式 */
.editing{gap:12px;border-style:dashed;border-color:var(--accent)}
.ed-row{display:flex;flex-direction:column;gap:4px}
.ed-row label,.ed-block legend{font-size:12px;color:var(--muted);font-weight:700}
.editing input:not([type=checkbox]),.editing select,.editing textarea,.sec-edit input:not([type=checkbox]),.sec-edit textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea{resize:vertical}
textarea.mono{font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre;overflow-x:auto}
.ed-block{border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap}
.mini{padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;align-self:flex-start}
.mini:disabled{opacity:.4;cursor:default}
.mini.danger{color:var(--warn);border-color:var(--warn)}
.mini.danger.armed{background:var(--warn);color:var(--surface)}
.sec-edit{display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}
.sec-edit .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.add-card,.add-sec{padding:16px;border:1px dashed var(--accent);border-radius:10px;background:transparent;color:var(--accent);font-weight:700;cursor:pointer}

#bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar-bg);color:var(--bar-fg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:10}
#bar .msg{font-size:14px;min-width:0;flex:1 1 240px}
#bar .acts{display:flex;gap:8px;flex-wrap:wrap}
#bar button{padding:8px 16px;border-radius:7px;border:1px solid var(--bar-fg);background:transparent;color:var(--bar-fg);font-weight:700;cursor:pointer}
#bar button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#bar button:disabled{opacity:.45;cursor:default}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
html{scroll-behavior:smooth}
</style>
</head>

  {
   "id": "files-explained",

   "ordered": false,
   "intro": "照「你會改到的機率」排。每張卡都寫了原理、常改的地方，程式碼裡的中文註解是我加的。",
   "cards": [
    {
     "id": "c36",
     "where": "file",
     "title": "mogi_arm.xacro：手臂的設計圖",
     "desc": "原理：機器人 = 零件（link）用關節（joint）串成一棵樹。world → base_link → shoulder → upper_arm → forearm → wrist → gripper → 兩根手指。\n\n每個 link 有三樣東西：inertial 給物理引擎算重量、collision 給物理引擎算碰撞、visual 給你看。collision 故意用圓柱、方塊這種簡單形狀，因為算得快。\n\nxacro 是「加強版 URDF」，可以用 xacro:include 把別的檔案接進來，執行時才展開成一般的 URDF。\n\n常改：關節的 limit（角度範圍）、origin（位置）、axis（轉軸），新增零件或感測器。",
     "blocks": [
      {
       "label": "~/ros2_ws/src/Week-9-10-Simple-arm/bme_ros2_simple_arm/urdf/mogi_arm.xacro（一組關節 + 零件）",
       "code": "\u003c!-- 關節：決定「怎麼動」 -->\n\u003cjoint name=\"shoulder_lift_joint\" type=\"revolute\">   \u003c!-- revolute=轉、prismatic=滑、fixed=不動 -->\n  \u003climit lower=\"-1.5708\" upper=\"1.5708\"\n         effort=\"330.0\" velocity=\"3.14\"/>            \u003c!-- 角度範圍(弧度)、最大力矩、最大速度 -->\n  \u003cparent link=\"shoulder_link\"/>                     \u003c!-- 接在誰下面 -->\n  \u003cchild link=\"upper_arm_link\"/>                     \u003c!-- 帶動誰 -->\n  \u003caxis xyz=\"0 1 0\"/>                                \u003c!-- 繞哪個軸轉：這裡是 Y 軸 -->\n  \u003corigin xyz=\"0.0 0.0 0.025\" rpy=\"0.0 0.0 0.0\"/>    \u003c!-- 關節在父零件座標的哪裡 -->\n\u003c/joint>\n\n\u003c!-- 零件：決定「長怎樣、多重」 -->\n\u003clink name=\"upper_arm_link\">\n  \u003cinertial>                                         \u003c!-- 給物理引擎：重量和慣量 -->\n    \u003cmass value=\"0.3\"/>\n    \u003corigin xyz=\"0.0 0.0 0.1\"/>                      \u003c!-- 重心位置 -->\n    \u003cinertia ixx=\"0.0012\" ixy=\"0.0\" ixz=\"0.0\" iyy=\"0.0012\" iyz=\"0.0\" izz=\"0.0004\"/>\n  \u003c/inertial>\n  \u003ccollision>                                        \u003c!-- 給物理引擎：碰撞用的簡單形狀 -->\n    \u003cgeometry>\u003ccylinder radius=\"0.05\" length=\"0.2\"/>\u003c/geometry>\n    \u003corigin xyz=\"0.0 0.0 0.1\"/>\n  \u003c/collision>\n  \u003cvisual>                                           \u003c!-- 給你看：外觀 -->\n    \u003cgeometry>\u003cmesh filename=\"package://bme_ros2_simple_arm/meshes/upper_arm.dae\"/>\u003c/geometry>\n    \u003cmaterial name=\"orange\"/>\n    \u003corigin xyz=\"0.0 0.0 0.1\"/>\n  \u003c/visual>\n\u003c/link>"
      },
      {
       "label": "同一個檔案下面的 ros2_control 區塊",
       "code": "\u003cros2_control name=\"GazeboSystem\" type=\"system\">\n  \u003chardware>\n    \u003cplugin>gz_ros2_control/GazeboSimSystem\u003c/plugin>   \u003c!-- 換實機時只改這行：換成馬達驅動 -->\n  \u003c/hardware>\n  \u003cjoint name=\"shoulder_pan_joint\">\n    \u003ccommand_interface name=\"position\">                \u003c!-- 收什麼指令：位置（角度） -->\n      \u003cparam name=\"min\">-2\u003c/param>\n      \u003cparam name=\"max\">2\u003c/param>\n    \u003c/command_interface>\n    \u003cstate_interface name=\"position\">                  \u003c!-- 回報：角度 -->\n      \u003cparam name=\"initial_value\">0.0\u003c/param>\n    \u003c/state_interface>\n    \u003cstate_interface name=\"velocity\"/>                 \u003c!-- 回報：速度 -->\n    \u003cstate_interface name=\"effort\"/>                   \u003c!-- 回報：力矩 ← 之後夾力控制要讀這個 -->\n  \u003c/joint>\n  \u003c!-- 其他關節照抄，只改 name -->\n\u003c/ros2_control>"
      }
     ],
     "note": "角度單位是弧度：1.5708 = 90 度、3.14 = 180 度。xyz 單位是公尺。"
    },
    {
     "id": "c37",
     "where": "file",
     "title": "mogi_arm.gazebo：只有模擬才需要的東西",
     "desc": "原理：URDF 描述的是「真實世界也成立」的東西（零件、關節、感測器裝在哪）。.gazebo 檔放的是「只有 Gazebo 看得懂」的設定：外掛、感測器規格、摩擦係數。\n\n換成實機時，xacro 保留，.gazebo 換成真的硬體驅動。所以拆成兩個檔案。\n\n常改：加感測器規格、改 controller yaml 的路徑。",
     "blocks": [
      {
       "label": "~/ros2_ws/src/Week-9-10-Simple-arm/bme_ros2_simple_arm/urdf/mogi_arm.gazebo",
       "code": "\u003crobot>\n  \u003c!-- 外掛 1：把 Gazebo 關節角度發出來 -->\n  \u003cgazebo>\n    \u003cplugin filename=\"gz-sim-joint-state-publisher-system\"\n            name=\"gz::sim::systems::JointStatePublisher\">\n      \u003ctopic>joint_states\u003c/topic>\n      \u003cjoint_name>shoulder_pan_joint\u003c/joint_name>\n      \u003c!-- …每個關節一行 -->\n    \u003c/plugin>\n  \u003c/gazebo>\n\n  \u003c!-- 外掛 2：ros2_control 的插座，並指定控制器設定檔 -->\n  \u003cgazebo>\n    \u003cplugin filename=\"gz_ros2_control-system\"\n            name=\"gz_ros2_control::GazeboSimROS2ControlPlugin\">\n      \u003cparameters>$(find bme_ros2_simple_arm)/config/controller_position.yaml\u003c/parameters>\n    \u003c/plugin>\n  \u003c/gazebo>\n\u003c/robot>"
      }
     ],
     "note": "這個檔案要在 mogi_arm.xacro 最上面用 xacro:include 接進來才有效，忘了接會出現 Could not contact service /controller_manager。"
    },
    {
     "id": "c38",
     "where": "file",
     "title": "controller_position.yaml：誰負責哪些關節",
     "desc": "原理：controller_manager 是總機，每秒跑 1000 次迴圈。底下掛兩個控制器：\n• joint_state_broadcaster：只讀不寫，把角度發到 /joint_states\n• arm_controller（JointTrajectoryController）：收「幾秒內轉到這些角度」，自己在中間補出平滑路徑再一步步送給關節\n\n常改：joints 清單（加減關節）、換控制器類型。",
     "blocks": [

}</script><script id="app">
(function(){
  var SRC = JSON.parse(document.getElementById('data').textContent);
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  var state = clone(SRC);
  var editing = false, dirty = false, query = '', readOnly = false, saving = false, msg = '';
  var PLACES = [['term','Ubuntu 終端機','黑色的 Linux 視窗，開頭是 rekis@…$'],['ps','PowerShell','Windows 開始選單搜尋 PowerShell'],['exp','Windows 檔案總管','資料夾視窗最上面的網址列'],['file','VS Code 檔案','用 code 開的檔案，存檔 Ctrl+S'],['none','照著做','不用打指令']];
  var FONT_LINK = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">';
  var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  var top = document.getElementById('top');
  var content = document.getElementById('content');
  var barEl = document.getElementById('bar');
  var uid = Date.now();
  function newId(p){ return p + (uid++).toString(36); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function placeName(k){ for (var i=0;i<PLACES.length;i++) if (PLACES[i][0]===k) return PLACES[i][1]; return PLACES[0][1]; }
  function placeKey(k){ for (var i=0;i<PLACES.length;i++) if (PLACES[i][0]===k) return k; return 'term'; }
  function today(){ var d=new Date(); function p(n){return (n<10?'0':'')+n;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }

  function matches(c){
    if (!query) return true;
    var hay = [c.title, c.desc, c.note].concat((c.blocks||[]).map(function(b){ return b.label+' '+b.code; })).join(' ').toLowerCase();
    return hay.indexOf(query.toLowerCase()) !== -1;
  }

  function renderTop(){
    top.innerHTML =
      '<p class="eyebrow">機械手臂專題 · WSL2 Ubuntu 24.04 · ROS 2 Jazzy</p>' +
      '<h1>機械手臂指令小抄</h1>' +
      '<p class="lede">用過的指令、程式架構和每個檔案的原理，加上改程式時可以直接複製的模組。每張卡片右上角的顏色告訴你要貼到哪裡。用「複製」按鈕再貼上，就不會把 rekis@…$ 一起貼進去。</p>' +
      '<div class="tools"><input id="q" type="search" placeholder="搜尋，例如 teleop、gz、explorer、手臂" aria-label="搜尋指令">' +
      '<button id="edit-toggle" class="btn" type="button">編輯內容</button></div>' +
      '<div class="legend">' + PLACES.map(function(p){ return '<span class="item"><span class="where w-'+p[0]+'">'+esc(p[1])+'</span>'+esc(p[2])+'</span>'; }).join('') + '</div>';
    document.getElementById('q').addEventListener('input', function(e){ query = e.target.value.trim(); render(); });
    document.getElementById('edit-toggle').addEventListener('click', function(){ editing = !editing; render(); });
  }

  function cardView(s, si, c, ci){
    var step = s.ordered ? '<span class="step">'+(ci+1)+'</span>' : '';
    var blocks = (c.blocks||[]).map(function(b, bi){
      return '<div class="block">' + (b.label ? '<div class="block-label">'+esc(b.label)+'</div>' : '') +
        '<div class="code-wrap"><pre><code>'+esc(b.code)+'</code></pre>' +
        '<button class="copy" type="button" data-act="copy" data-s="'+si+'" data-c="'+ci+'" data-b="'+bi+'">複製</button></div></div>';
    }).join('');
    return '<article class="card">' +
      '<div class="card-top">'+step+'<h3>'+esc(c.title)+'</h3><span class="where w-'+placeKey(c.where)+'">'+esc(placeName(c.where))+'</span></div>' +
      (c.desc ? '<p class="desc">'+esc(c.desc)+'</p>' : '') + blocks +
      (c.note ? '<p class="note"><b>提醒</b>'+esc(c.note)+'</p>' : '') + '</article>';
  }

  function cardEdit(s, si, c, ci){
    var n = s.cards.length, id = esc(c.id);
    var blocks = (c.blocks||[]).map(function(b, bi){
      var rows = Math.min(10, Math.max(2, String(b.code).split('\n').length));
      return '<fieldset class="ed-block"><legend>指令區塊 '+(bi+1)+'</legend>' +
        '<input id="bl-'+id+'-'+bi+'" data-f="label" data-b="'+bi+'" value="'+esc(b.label)+'" placeholder="標籤，可空白（例如：終端機 1）" aria-label="區塊標籤">' +
        '<textarea id="bc-'+id+'-'+bi+'" class="mono" data-f="code" data-b="'+bi+'" rows="'+rows+'" aria-label="指令內容" spellcheck="false">'+esc(b.code)+'</textarea>' +
        '<button class="mini" type="button" data-act="del-block" data-b="'+bi+'">移除這個區塊</button></fieldset>';
    }).join('');
    return '<article class="card editing" data-s="'+si+'" data-c="'+ci+'">' +
      '<div class="ed-row"><label for="w-'+id+'">貼到哪裡</label><select id="w-'+id+'" data-f="where">' +
        PLACES.map(function(p){ return '<option value="'+p[0]+'"'+(p[0]===c.where?' selected':'')+'>'+esc(p[1])+'</option>'; }).join('') + '</select></div>' +
      '<div class="ed-row"><label for="t-'+id+'">標題</label><input id="t-'+id+'" data-f="title" value="'+esc(c.title)+'"></div>' +
      '<div class="ed-row"><label for="d-'+id+'">說明</label><textarea id="d-'+id+'" data-f="desc" rows="2">'+esc(c.desc)+'</textarea></div>' +
      blocks +
      '<button class="mini" type="button" data-act="add-block">＋ 加一個指令區塊</button>' +
      '<div class="ed-row"><label for="n-'+id+'">提醒</label><textarea id="n-'+id+'" data-f="note" rows="2">'+esc(c.note)+'</textarea></div>' +
      '<div class="ed-actions"><button class="mini" type="button" data-act="up"'+(ci===0?' disabled':'')+'>上移</button>' +
      '<button class="mini" type="button" data-act="down"'+(ci===n-1?' disabled':'')+'>下移</button>' +
      '<button class="mini danger" type="button" data-act="del-card">刪除這張卡片</button></div></article>';
  }

  function secHead(s, si){
    if (!editing) {
      return '<div class="sec-head"><h2>'+esc(s.title)+'</h2><span class="count">'+s.cards.length+' 張</span></div>' +
        (s.intro ? '<p class="intro">'+esc(s.intro)+'</p>' : '');
    }
    var id = esc(s.id);
    return '<div class="sec-edit" data-s="'+si+'">' +
      '<div class="ed-row"><label for="st-'+id+'" style="font-size:12px;color:var(--muted);font-weight:700">分類名稱</label><input id="st-'+id+'" data-sf="title" value="'+esc(s.title)+'"></div>' +
      '<div class="ed-row"><label for="sg-'+id+'" style="font-size:12px;color:var(--muted);font-weight:700">放在目錄的哪一組（指令／程式架構／複製模組，或自己取名）</label><input id="sg-'+id+'" data-sf="group" value="'+esc(s.group)+'"></div>' +
      '<div class="ed-row"><label for="si-'+id+'" style="font-size:12px;color:var(--muted);font-weight:700">分類說明</label><textarea id="si-'+id+'" data-sf="intro" rows="2">'+esc(s.intro)+'</textarea></div>' +
      '<div class="row"><label><input type="checkbox" id="so-'+id+'" data-sf="ordered"'+(s.ordered?' checked':'')+'> 卡片有先後順序（顯示步驟編號）</label>' +
      '<button class="mini danger" type="button" data-act="del-sec">刪除整個分類</button></div></div>';
  }

  function render(){
    var q = document.getElementById('q');
    if (q) q.disabled = editing;
    var t = document.getElementById('edit-toggle');
    if (t) { t.textContent = editing ? '完成編輯' : '編輯內容'; t.classList.toggle('on', editing); }
    var groups = [];
    state.sections.forEach(function(s){
      var g = s.group || '其他', found = null;
      for (var i=0;i<groups.length;i++) if (groups[i].name === g) found = groups[i];
      if (!found) { found = { name: g, items: [] }; groups.push(found); }
      found.items.push(s);
    });
    var html = '<nav class="toc" aria-label="分類">' + groups.map(function(g){
      return '<div class="toc-group"><span class="toc-label">'+esc(g.name)+'</span><div class="toc-links">' +
        g.items.map(function(s){ return '<a href="#'+esc(s.id)+'">'+esc(s.title)+'</a>'; }).join('') + '</div></div>';
    }).join('') + '</nav>';
    var shown = 0;
    state.sections.forEach(function(s, si){
      var list = [];
      s.cards.forEach(function(c, ci){ if (editing || matches(c)) list.push([c, ci]); });
      if (!editing && query && !list.length) return;
      shown += list.length;
      html += '<section class="sec" id="'+esc(s.id)+'">' + secHead(s, si) + '<div class="grid">' +
        list.map(function(x){ return editing ? cardEdit(s, si, x[0], x[1]) : cardView(s, si, x[0], x[1]); }).join('') +
        (editing ? '<button class="add-card" type="button" data-act="add-card" data-s="'+si+'">＋ 在「'+esc(s.title)+'」新增一張卡片</button>' : '') +
        '</div></section>';
    });
    if (!editing && query && !shown) html += '<p class="empty">找不到「'+esc(query)+'」。試試指令裡的英文字，例如 launch、teleop、gz。</p>';
    if (editing) html += '<button class="add-sec" type="button" data-act="add-sec">＋ 新增一個分類</button>';
    html += '<footer class="foot">最後更新 '+esc(state.updated)+'</footer>';
    content.innerHTML = html;
    renderBar();
  }

  function renderBar(){
    if (!editing && !dirty && !msg) { barEl.hidden = true; return; }
    barEl.hidden = false;
    var text = msg || (dirty ? '有還沒儲存的修改。' : '編輯模式：直接改欄位，改完按「儲存到網站」。');
    barEl.innerHTML = '<span class="msg">'+esc(text)+'</span><div class="acts">' +
      (stashed() ? '<button type="button" data-act="restore">還原上次沒存到的修改</button>' : '') +
      '<button type="button" data-act="discard"'+(dirty && !saving ? '' : ' disabled')+'>放棄修改</button>' +
      '<button type="button" class="primary" data-act="save"'+(dirty && !saving && !readOnly ? '' : ' disabled')+'>'+(saving?'儲存中…':'儲存到網站')+'</button></div>';
  }

  function markDirty(){ if (!dirty) { dirty = true; msg = ''; renderBar(); } }

  function stashed(){ try { return !!sessionStorage.getItem('cmd-draft'); } catch(e){ return false; } }

  function buildDoc(){
    var next = clone(state); next.updated = today();
    var json = JSON.stringify(next, null, 1).replace(/</g, '\\u003c');
    var S = '<' + '/script>';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>機械手臂指令小抄</title>' + FONT_LINK +
      '<style id="page-css">' + document.getElementById('page-css').textContent + '</style>' +
      '<div class="wrap"><header class="top" id="top"></header><main id="content" class="wrap-inner" style="display:flex;flex-direction:column;gap:44px"></main></div><div id="bar" hidden></div>' +
      '<script type="application/json" id="data">' + json + S +
      '<script id="app">' + document.getElementById('app').textContent + S +
      '</body></html>';
  }

  async function save(){
    if (!dirty || saving || readOnly) return;
    saving = true; msg = '儲存中…'; renderBar();
    var art = null;
    try { art = (window.claude && window.claude.use) ? await window.claude.use('artifact') : null; } catch(e){ art = null; }
    if (!art) { saving = false; msg = '這個畫面沒辦法儲存。請在 claude.ai 打開這個網站再按儲存。'; renderBar(); return; }
    try {
      await art.publish(buildDoc());
      try { sessionStorage.removeItem('cmd-draft'); } catch(e){}
      dirty = false; msg = '已儲存，頁面會自動重新載入。';
    } catch(err){
      var code = err && err.code;
      if (code === 'conflict') {
        try { sessionStorage.setItem('cmd-draft', JSON.stringify(state)); } catch(e){}
        msg = '剛剛有人（或 Claude）先更新了網站，頁面會載入最新版。重新載入後按「還原上次沒存到的修改」。';
      } else if (['not_writer','not_granted','consent_required','not_declared','capability_disabled','capability_removed'].indexOf(code) !== -1) {
        readOnly = true; msg = '這是唯讀檢視，只有網站擁有者能儲存。';
      } else if (code === 'rate_limited') {
        msg = '存得太頻繁了，等一分鐘再按儲存。';
      } else if (code === 'too_large') {
        msg = '內容太大存不下，刪掉一些卡片再試。';
      } else {
        msg = '儲存失敗（' + (code || '未知原因') + '），稍後再按一次。';
      }
    }
    saving = false; renderBar();
  }

  function cardOf(el){
    var a = el.closest('.card[data-c]');
    if (!a) return null;
    return { s: +a.dataset.s, c: +a.dataset.c, card: state.sections[+a.dataset.s].cards[+a.dataset.c] };
  }

  function onField(e){
    var t = e.target;
    if (t.dataset.sf) {
      var s = state.sections[+t.closest('.sec-edit').dataset.s];
      s[t.dataset.sf] = t.type === 'checkbox' ? t.checked : t.value;
      markDirty(); return;
    }
    if (t.dataset.f) {
      var ref = cardOf(t); if (!ref) return;
      if (t.dataset.b != null) ref.card.blocks[+t.dataset.b][t.dataset.f] = t.value;
      else ref.card[t.dataset.f] = t.value;
      markDirty();
    }
  }
  content.addEventListener('input', onField);
  content.addEventListener('change', onField);

  function arm(btn, label){
    if (btn.dataset.armed === '1') return true;
    btn.dataset.armed = '1'; btn.classList.add('armed');
    var old = btn.textContent; btn.textContent = label;
    setTimeout(function(){ if (btn.isConnected) { btn.dataset.armed = ''; btn.classList.remove('armed'); btn.textContent = old; } }, 4000);
    return false;
  }

  content.addEventListener('click', function(e){
    var btn = e.target.closest('[data-act]'); if (!btn) return;
    var act = btn.dataset.act, ref;
    if (act === 'copy') {
      var code = state.sections[+btn.dataset.s].cards[+btn.dataset.c].blocks[+btn.dataset.b].code;
      var done = function(){ btn.textContent = '已複製'; btn.classList.add('done'); setTimeout(function(){ btn.textContent = '複製'; btn.classList.remove('done'); }, 1500); };
      var fallback = function(){ var pre = btn.parentNode.querySelector('pre'); var r = document.createRange(); r.selectNodeContents(pre); var sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = '已選取，按 Ctrl+C'; };
      try { navigator.clipboard.writeText(code).then(done, fallback); } catch(err){ fallback(); }
      return;
    }
    if (act === 'add-card') {
      var sec = state.sections[+btn.dataset.s];
      var nc = { id: newId('c'), where: 'term', title: '新的指令', desc: '', blocks: [{ label: '', code: '' }], note: '' };
      sec.cards.push(nc); markDirty(); render();
      var el = document.getElementById('t-' + nc.id); if (el) { el.focus(); el.select(); }
      return;
    }
    if (act === 'add-sec') {
      var ns = { id: newId('s'), title: '新的分類', intro: '', ordered: false, cards: [] };
      state.sections.push(ns); markDirty(); render();
      var se = document.getElementById('st-' + ns.id); if (se) { se.focus(); se.select(); }
      return;
    }
    if (act === 'del-sec') {
      if (!arm(btn, '再按一次，整個分類會刪掉')) return;
      state.sections.splice(+btn.closest('.sec-edit').dataset.s, 1); markDirty(); render(); return;
    }
    ref = cardOf(btn); if (!ref) return;
    var cards = state.sections[ref.s].cards;
    if (act === 'add-block') { ref.card.blocks.push({ label: '', code: '' }); }
    else if (act === 'del-block') { ref.card.blocks.splice(+btn.dataset.b, 1); }
    else if (act === 'up' && ref.c > 0) { cards.splice(ref.c - 1, 0, cards.splice(ref.c, 1)[0]); }
    else if (act === 'down' && ref.c < cards.length - 1) { cards.splice(ref.c + 1, 0, cards.splice(ref.c, 1)[0]); }
    else if (act === 'del-card') { if (!arm(btn, '再按一次確定刪除')) return; cards.splice(ref.c, 1); }
    else return;
    markDirty(); render();
  });

  barEl.addEventListener('click', function(e){
    var btn = e.target.closest('[data-act]'); if (!btn) return;
    if (btn.dataset.act === 'save') save();
    else if (btn.dataset.act === 'discard') { state = clone(SRC); dirty = false; msg = ''; render(); }
    else if (btn.dataset.act === 'restore') {
      try { var d = JSON.parse(sessionStorage.getItem('cmd-draft')); sessionStorage.removeItem('cmd-draft'); if (d && d.sections) { state = d; editing = true; dirty = true; msg = '已還原你的修改，記得再按一次儲存。'; } } catch(err){}
      render();
    }
  });

  renderTop();
  render();
})();
</script>

</body>
</html>
